# Docker Compose genérico (fora do CasaOS). Para o CasaOS use casaos/estudio-ia.yml.
services:
  estudio-ia:
    # Imagem pronta do GitHub. Para compilar localmente: docker compose up -d --build
    image: ghcr.io/diegoukan/roupas_ia_project:latest
    build: .
    container_name: estudio-ia
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TZ=America/Sao_Paulo
    volumes:
      - estudio-dados:/app/data
      # Pastas de trabalho ("Para editar" e "Editadas") ficam visíveis aqui ao lado.
      - ./arquivos:/app/arquivos

volumes:
  estudio-dados:
